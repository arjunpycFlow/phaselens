<text x="66" y="162" font-size="22" fill="#9AA4B2">Phase-aware stock analysis for Claude.</text>
<text x="66" y="194" font-size="22" fill="#9AA4B2">Know the business, the price, and the exact</text>
<text x="66" y="226" font-size="22" fill="#9AA4B2">price to start buying.</text></g>
