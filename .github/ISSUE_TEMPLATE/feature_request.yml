name: Feature request
description: A method, sector or check PhaseLens should handle.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What analysis gets wrong or is missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should PhaseLens do instead?
      description: Cite a source for any new rule or threshold.
